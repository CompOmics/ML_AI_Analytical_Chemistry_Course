<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" font-family="Calibri,Arial,sans-serif">
  <!-- edges -->
  <line x1="220" y1="56" x2="120" y2="120" stroke="#64748B" stroke-width="2"/>
  <line x1="220" y1="56" x2="330" y2="120" stroke="#64748B" stroke-width="2"/>
  <line x1="120" y1="160" x2="70"  y2="226" stroke="#64748B" stroke-width="2"/>
  <line x1="120" y1="160" x2="180" y2="226" stroke="#64748B" stroke-width="2"/>
  <!-- branch labels -->
  <text x="158" y="92" text-anchor="middle" font-size="13" fill="#64748B">yes</text>
  <text x="290" y="92" text-anchor="middle" font-size="13" fill="#64748B">no</text>
  <!-- root -->
  <rect x="140" y="12" width="160" height="44" rx="8" fill="#028090"/>
  <text x="220" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">C=O near 1715?</text>
  <!-- left internal -->
  <rect x="40" y="120" width="160" height="40" rx="8" fill="#00A896"/>
  <text x="120" y="145" text-anchor="middle" font-size="13" fill="#FFFFFF">broad 2500-3300?</text>
  <!-- right leaf -->
  <rect x="255" y="120" width="150" height="40" rx="8" fill="#CBE6E0"/>
  <text x="330" y="145" text-anchor="middle" font-size="13" fill="#1E293B">O-H / N-H test</text>
  <!-- leaves -->
  <rect x="10" y="226" width="120" height="40" rx="8" fill="#CBE6E0"/>
  <text x="70" y="251" text-anchor="middle" font-size="12.5" fill="#1E293B">carboxylic acid</text>
  <rect x="140" y="226" width="120" height="40" rx="8" fill="#CBE6E0"/>
  <text x="200" y="251" text-anchor="middle" font-size="12.5" fill="#1E293B">ketone</text>
</svg>
