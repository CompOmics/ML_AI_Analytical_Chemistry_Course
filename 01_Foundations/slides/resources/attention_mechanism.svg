<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Calibri,Arial,sans-serif">
  <!-- attention lines from tokens 0,1,3,4 to context -->
  <g stroke="#00A896" stroke-width="1.6">
    <line x1="70" y1="36"  x2="250" y2="150"/>
    <line x1="70" y1="92"  x2="250" y2="150"/>
    <line x1="70" y1="204" x2="250" y2="150"/>
    <line x1="70" y1="260" x2="250" y2="150"/>
  </g>
  <!-- tokens -->
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <rect x="30" y="18"  width="40" height="36" rx="7" fill="#CBE6E0"/><text x="50" y="42" fill="#1E293B">G</text>
    <rect x="30" y="74"  width="40" height="36" rx="7" fill="#CBE6E0"/><text x="50" y="98" fill="#1E293B">S</text>
    <rect x="30" y="130" width="40" height="36" rx="7" fill="#028090"/><text x="50" y="154" fill="#FFFFFF">A</text>
    <rect x="30" y="186" width="40" height="36" rx="7" fill="#CBE6E0"/><text x="50" y="210" fill="#1E293B">V</text>
    <rect x="30" y="242" width="40" height="36" rx="7" fill="#CBE6E0"/><text x="50" y="266" fill="#1E293B">K</text>
  </g>
  <!-- context -->
  <rect x="240" y="124" width="100" height="52" rx="8" fill="#02C39A"/>
  <text x="290" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">context</text>
  <text x="180" y="295" text-anchor="middle" font-size="12" font-style="italic" fill="#64748B">one position attends to all others</text>
</svg>
