<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="Calibri,Arial,sans-serif">
  <g stroke="#C7DCDC" stroke-width="1.5">
    <!-- input(4) y: 40,100,160,220 x60 ; hidden(3) y:70,140,210 x180 ; output(1) y140 x300 -->
    <line x1="60" y1="40" x2="180" y2="70"/><line x1="60" y1="40" x2="180" y2="140"/><line x1="60" y1="40" x2="180" y2="210"/>
    <line x1="60" y1="100" x2="180" y2="70"/><line x1="60" y1="100" x2="180" y2="140"/><line x1="60" y1="100" x2="180" y2="210"/>
    <line x1="60" y1="160" x2="180" y2="70"/><line x1="60" y1="160" x2="180" y2="140"/><line x1="60" y1="160" x2="180" y2="210"/>
    <line x1="60" y1="220" x2="180" y2="70"/><line x1="60" y1="220" x2="180" y2="140"/><line x1="60" y1="220" x2="180" y2="210"/>
    <line x1="180" y1="70" x2="300" y2="140"/><line x1="180" y1="140" x2="300" y2="140"/><line x1="180" y1="210" x2="300" y2="140"/>
  </g>
  <g>
    <circle cx="60" cy="40" r="15" fill="#00A896"/><circle cx="60" cy="100" r="15" fill="#00A896"/><circle cx="60" cy="160" r="15" fill="#00A896"/><circle cx="60" cy="220" r="15" fill="#00A896"/>
    <circle cx="180" cy="70" r="15" fill="#028090"/><circle cx="180" cy="140" r="15" fill="#028090"/><circle cx="180" cy="210" r="15" fill="#028090"/>
    <circle cx="300" cy="140" r="15" fill="#02C39A"/>
  </g>
  <text x="60" y="270" text-anchor="middle" font-size="13" fill="#64748B">input</text>
  <text x="180" y="270" text-anchor="middle" font-size="13" fill="#64748B">hidden</text>
  <text x="300" y="270" text-anchor="middle" font-size="13" fill="#64748B">output</text>
</svg>
