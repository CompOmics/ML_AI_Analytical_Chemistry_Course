<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" font-family="Calibri,Arial,sans-serif">
  <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">Anatomy of a good prompt</text>
  <rect x="20" y="42" width="130" height="34" rx="7" fill="#028090"/>
  <text x="85" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Context</text>
  <text x="165" y="64" font-size="12.5" fill="#1E293B">what the data are and where they come from</text>
  <rect x="20" y="86" width="130" height="34" rx="7" fill="#028090"/>
  <text x="85" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Goal</text>
  <text x="165" y="108" font-size="12.5" fill="#1E293B">the precise task, stated unambiguously</text>
  <rect x="20" y="130" width="130" height="34" rx="7" fill="#028090"/>
  <text x="85" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Example</text>
  <text x="165" y="152" font-size="12.5" fill="#1E293B">a small input/output sample</text>
  <rect x="20" y="174" width="130" height="34" rx="7" fill="#028090"/>
  <text x="85" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Format</text>
  <text x="165" y="196" font-size="12.5" fill="#1E293B">the shape of the answer (DataFrame, plot, length)</text>
  <rect x="20" y="218" width="130" height="34" rx="7" fill="#028090"/>
  <text x="85" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Reasoning</text>
  <text x="165" y="240" font-size="12.5" fill="#1E293B">ask for steps when the task is non-trivial</text>
</svg>
