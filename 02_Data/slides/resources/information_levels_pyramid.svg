<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" font-family="Calibri,Arial,sans-serif">
  <!-- pyramid tiers (top = knowledge) -->
  <polygon points="180,20 240,80 120,80" fill="#02C39A"/>
  <polygon points="120,84 240,84 280,150 80,150" fill="#00A896"/>
  <polygon points="80,154 280,154 320,220 40,220" fill="#028090"/>
  <polygon points="40,224 320,224 360,290 0,290" fill="#065A5A"/>
  <text x="180" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">knowledge</text>
  <text x="180" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">identifications</text>
  <text x="180" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">peaks / features</text>
  <text x="180" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">raw spectra (mzML)</text>
  <!-- AI arrow bypassing levels -->
  <line x1="405" y1="285" x2="405" y2="45" stroke="#1E293B" stroke-width="2.5" marker-end="url(#ah)"/>
  <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1E293B"/></marker></defs>
  <text x="420" y="170" text-anchor="middle" font-size="12" fill="#1E293B" transform="rotate(90 420 170)">AI delivers the top directly</text>
  <text x="180" y="312" text-anchor="middle" font-size="11" font-style="italic" fill="#64748B">information is lost at each step upward</text>
</svg>
