<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" font-family="Calibri,Arial,sans-serif">
  <text x="460" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">Where machine learning touches the LC-MS pipeline</text>
  <rect x="20" y="55" width="160" height="58" rx="8" fill="#028090"/>
  <text x="100.0" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Separation</text>
  <text x="100.0" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">(LC)</text>
  <line x1="180" y1="84.0" x2="200" y2="84.0" stroke="#64748B" stroke-width="2"/>
  <line x1="100.0" y1="113" x2="100.0" y2="135" stroke="#02C39A" stroke-width="2"/>
  <rect x="26" y="135" width="148" height="48" rx="8" fill="#EAF6F6" stroke="#00A896" stroke-width="1.5"/>
  <text x="100.0" y="155" text-anchor="middle" font-size="12" fill="#065A5A">retention</text>
  <text x="100.0" y="171" text-anchor="middle" font-size="12" fill="#065A5A">prediction</text>
  <rect x="200" y="55" width="160" height="58" rx="8" fill="#028090"/>
  <text x="280.0" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Ionisation,</text>
  <text x="280.0" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">fragmentation</text>
  <line x1="360" y1="84.0" x2="380" y2="84.0" stroke="#64748B" stroke-width="2"/>
  <line x1="280.0" y1="113" x2="280.0" y2="135" stroke="#02C39A" stroke-width="2"/>
  <rect x="206" y="135" width="148" height="48" rx="8" fill="#EAF6F6" stroke="#00A896" stroke-width="1.5"/>
  <text x="280.0" y="155" text-anchor="middle" font-size="12" fill="#065A5A">fragmentation</text>
  <text x="280.0" y="171" text-anchor="middle" font-size="12" fill="#065A5A">prediction</text>
  <rect x="380" y="55" width="160" height="58" rx="8" fill="#028090"/>
  <text x="460.0" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Acquisition</text>
  <line x1="540" y1="84.0" x2="560" y2="84.0" stroke="#64748B" stroke-width="2"/>
  <line x1="460.0" y1="113" x2="460.0" y2="135" stroke="#02C39A" stroke-width="2"/>
  <rect x="386" y="135" width="148" height="48" rx="8" fill="#EAF6F6" stroke="#00A896" stroke-width="1.5"/>
  <text x="460.0" y="155" text-anchor="middle" font-size="12" fill="#065A5A">a priori</text>
  <text x="460.0" y="171" text-anchor="middle" font-size="12" fill="#065A5A">optimisation</text>
  <rect x="560" y="55" width="160" height="58" rx="8" fill="#028090"/>
  <text x="640.0" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Peak</text>
  <text x="640.0" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">detection</text>
  <line x1="720" y1="84.0" x2="740" y2="84.0" stroke="#64748B" stroke-width="2"/>
  <line x1="640.0" y1="113" x2="640.0" y2="135" stroke="#02C39A" stroke-width="2"/>
  <rect x="566" y="135" width="148" height="48" rx="8" fill="#EAF6F6" stroke="#00A896" stroke-width="1.5"/>
  <text x="640.0" y="155" text-anchor="middle" font-size="12" fill="#065A5A">signal</text>
  <text x="640.0" y="171" text-anchor="middle" font-size="12" fill="#065A5A">detection (CNN)</text>
  <rect x="740" y="55" width="160" height="58" rx="8" fill="#028090"/>
  <text x="820.0" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Identification</text>
  <line x1="820.0" y1="113" x2="820.0" y2="135" stroke="#02C39A" stroke-width="2"/>
  <rect x="746" y="135" width="148" height="48" rx="8" fill="#EAF6F6" stroke="#00A896" stroke-width="1.5"/>
  <text x="820.0" y="155" text-anchor="middle" font-size="12" fill="#065A5A">rescoring,</text>
  <text x="820.0" y="171" text-anchor="middle" font-size="12" fill="#065A5A">CCS</text>
