<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" font-family="Calibri,Arial,sans-serif">
  <line x1="55" y1="250" x2="440" y2="250" stroke="#64748B" stroke-width="1.5"/>
  <line x1="55" y1="30" x2="55" y2="250" stroke="#64748B" stroke-width="1.5"/>
  <text x="250" y="285" text-anchor="middle" font-size="12" fill="#64748B">model complexity</text>
  <text x="20" y="140" text-anchor="middle" font-size="12" fill="#64748B" transform="rotate(-90 20 140)">error</text>
  <!-- training error: monotonic decreasing -->
  <path d="M70,70 C150,150 250,205 430,235" fill="none" stroke="#00A896" stroke-width="3"/>
  <!-- test error: U-shape -->
  <path d="M70,150 C170,250 270,250 430,90" fill="none" stroke="#028090" stroke-width="3"/>
  <!-- sweet spot marker -->
  <line x1="225" y1="40" x2="225" y2="250" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="225" cy="232" r="5" fill="#1E293B"/>
  <text x="225" y="32" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E293B">best generalisation</text>
  <text x="408" y="232" font-size="12" fill="#00A896" font-weight="bold">training</text>
  <text x="408" y="80" font-size="12" fill="#028090" font-weight="bold">test</text>
  <text x="95" y="240" font-size="10.5" fill="#64748B">underfit</text>
  <text x="360" y="240" font-size="10.5" fill="#64748B">overfit</text>
</svg>
